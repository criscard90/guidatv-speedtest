<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home TV — Guida & Speedtest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="clock">--:--</div>
    <div id="date">&nbsp;</div>
    <div id="updated"></div>
  </header>

  <main id="stage">
    <section id="slide">
      <img id="prog-img" alt="" src="">
      <div id="prog-info">
        <div id="onair" class="onair hidden">
          <span class="onair-dot">▶</span>
          <div class="onair-text">
            <div id="onair-label" class="onair-label">ORA IN ONDA</div>
            <div id="onair-title">&nbsp;</div>
          </div>
          <span id="onair-time" class="onair-time"></span>
        </div>
        <div class="prog-meta">
          <div>
            <div class="prime-label">PRIMA SERATA STASERA</div>
            <span id="prog-channel" class="chip">&nbsp;</span>
            <span id="prog-chnum" class="chnum"></span>
            <span id="prog-time" class="time"></span>
            <span id="prog-genre" class="genre"></span>
          </div>
        </div>
        <h1 id="prog-title">&nbsp;</h1>
        <p id="prog-desc"></p>
      </div>
      <aside id="weather" class="weather hidden">
        <div class="weather-title">METEO</div>
        <div class="w-card">
          <div class="w-head"><span class="w-label"></span><span class="w-icon"></span></div>
          <div class="w-desc"></div>
          <div class="w-temps"><span class="w-tmax"></span><span class="w-tmin"></span></div>
          <div class="w-row">🌧️ <span class="w-rainp"></span> · <span class="w-rainmm"></span></div>
          <div class="w-row">💨 <span class="w-wind"></span></div>
        </div>
        <div class="w-card">
          <div class="w-head"><span class="w-label"></span><span class="w-icon"></span></div>
          <div class="w-desc"></div>
          <div class="w-temps"><span class="w-tmax"></span><span class="w-tmin"></span></div>
          <div class="w-row">🌧️ <span class="w-rainp"></span> · <span class="w-rainmm"></span></div>
          <div class="w-row">💨 <span class="w-wind"></span></div>
        </div>
      </aside>
    </section>
    <div id="dots"></div>
  </main>

  <footer id="bottombar">
    <div class="speed-box">
      <div class="speed-label">SPEEDTEST RETE DI CASA</div>
      <div class="speed-values">
        <div class="sv"><span id="speed-down">–</span><small>Mbps ↓</small></div>
        <div class="sv"><span id="speed-up">–</span><small>Mbps ↑</small></div>
        <div class="sv"><span id="speed-ping">–</span><small>ms ping</small></div>
      </div>
      <div id="speed-time">&nbsp;</div>
    </div>
    <div class="spark-box">
      <div class="speed-label">STORICO DOWNLOAD (48H)</div>
      <canvas id="spark" width="460" height="72"></canvas>
    </div>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
